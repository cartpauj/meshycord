; MeshCore -> Discord bridge, ESP32-C3
;
; Target hardware (read off the actual board with esptool):
;   ESP32-C3 (QFN32) rev v0.3, single-core RISC-V 160MHz, 400KB SRAM,
;   NO PSRAM, 4MB flash, MAC 60:55:f9:7c:2a:8c
;
; The C3 has no PSRAM, so RAM is the binding constraint: NimBLE + WiFi +
; mbedTLS all live in that 400KB. Hence NimBLE (not Bluedroid) and the
; trimmed NimBLE feature flags below.

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_c3_exception_decoder, time

; The default 4MB scheme reserves two 1.25MB OTA slots, which left the build at
; 85.6% flash. This bridge is flashed over USB on the bench, so trade OTA away
; for a single 3MB app partition.
board_build.partitions = huge_app.csv

; REQUIRED on this board. At the 80MHz default the C3 boot-loops forever with
;   rst:0x3 (RTC_SW_SYS_RST)
; and prints nothing useful — the flash chip on these C3 boards (Super Mini and
; similar) cannot sustain 80MHz, and the failure is completely silent because
; the ESP-IDF bootloader console goes to UART0, not USB. Verified empirically:
; 80MHz = 919 resets in 12s, 40MHz = 0. Known issue, see
; platformio/platform-espressif32#622 and #821.
board_build.flash_mode = dio
board_build.f_flash = 40000000L

lib_deps =
  h2zero/NimBLE-Arduino @ ^1.4.3
  bblanchon/ArduinoJson @ ^7.2.0

build_flags =
  ; native USB CDC for the serial console (C3 has USB-Serial/JTAG)
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

  ; NOTE: NimBLE-Arduino 1.4.3's nimconfig.h defines CONFIG_BT_NIMBLE_ROLE_*
  ; and friends unconditionally, so setting them here only produces
  ; "redefined" warnings and has no effect. To actually drop the unused
  ; peripheral/broadcaster roles and shrink the connection table, edit
  ; .pio/libdeps/esp32c3/NimBLE-Arduino/src/nimconfig.h — worth doing only if
  ; the heap measurement says we need it.

  ; ArduinoJson: we only parse small Discord replies
  -D ARDUINOJSON_USE_DOUBLE=0
  -D ARDUINOJSON_USE_LONG_LONG=1

build_unflags =
  -std=gnu++11
